      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "604a54a76594e2eb38bf1fc92018eade", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "363482bbb9d8364b61882999595aecd0", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"day-1-lab-first-contact\"\u003EDay 1 Lab \u2014 First Contact\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EIBM Quantum Composer \u00b7 drag-and-drop, no code \u00b7 90 min\u003C/strong\u003E\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EYou need:\u003C/strong\u003E an IBM Quantum account (\u003Ccode\u003Equantum.ibm.com\u003C/code\u003E) \u2014 made in the morning bridge or from the pre-class email.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EBy the end:\u003C/strong\u003E you'll have run a Bell state on a real superconducting quantum computer and read its histogram.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003ETiers: \u003C/em\u003E\u003Cem\u003Ebaseline\u003C/em\u003E\u003Cem\u003E everyone \u00b7 \u003C/em\u003E\u003Cem\u003Estretch\u003C/em\u003E\u003Cem\u003E most of you \u00b7 \u003C/em\u003E\u003Cem\u003Easpirational\u003C/em\u003E\u003Cem\u003E if you get there.\nStuck on login / browser / backend stuff? Ask a TA. Stuck on \"why does it do that?\" \u2014 that one's for Wael.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "843ee47e7f47111d70e11378464a7453", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "5508834c3edf54b46980286b3aee2a5b", "console": [], "id": "bkHC", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"setup-orientation-15-min\"\u003ESetup \u0026amp; orientation  \u00b7  15 min\u003C/h2\u003E\n\u003Col\u003E\n\u003Cli\u003EGo to \u003Ccode\u003Equantum.ibm.com\u003C/code\u003E and sign in.\u003C/li\u003E\n\u003Cli\u003EOpen \u003Cstrong\u003ECompute resources\u003C/strong\u003E \u2014 the live fleet of every public IBM quantum computer: qubit counts, gate error rates, current queue lengths.\n    \u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cimg src='data:image/webp;base64,UklGRu7JAABXRUJQVlA4WAoAAAA8AAAAdwcA2QQASUNDUBgCAAAAAAIYYXBwbAQAAABtbnRyUkdCIFhZWiAH5gABAAEAAAAAAABhY3NwQVBQTAAAAABBUFBMAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWFwcGwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAApkZXNjAAAA/AAAADBjcHJ0AAABLAAAAFB3dHB0AAABfAAAABRyWFlaAAABkAAAABRnWFlaAAABpAAAABRiWFlaAAABuAAAABRyVFJDAAABzAAAACBjaGFkAAAB7AAAACxiVFJDAAABzAAAACBnVFJDAAABzAAAACBtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABQAAAAcAEQAaQBzAHAAbABhAHkAIABQADNtbHVjAAAAAAAAAAEAAAAMZW5VUwAAADQAAAAcAEMAbwBwAHkAcgBpAGcAaAB0ACAAQQBwAHAAbABlACAASQBuAGMALgAsACAAMgAwADIAMlhZWiAAAAAAAAD21QABAAAAANMsWFlaIAAAAAAAAIPfAAA9v////7tYWVogAAAAAAAASr8AALE3AAAKuVhZWiAAAAAAAAAoOAAAEQsAAMi5cGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltzZjMyAAAAAAABDEIAAAXe///zJgAAB5MAAP2Q///7ov///aMAAAPcAADAbkFMUEg8KgAAARnFbdtGiJLezv5D+10gov8TQPjOSfp0Ix81+ODFB0pshkyextrLJZS5173XY410DuO2bSRJ7r/rudfvBSJiAlj6fYDgUJhIb/D/m/QyUClDs2AqRGPXAm3VdhtLsh1mTiqmjiqX6fIB+f8PSFoGg/acc61z7pNSreE1PQ0RE0AJtu2wbQOREPgJUPdjcwHZSdotJTeSJEkS5v+/rvJwWzKr56TQEOglIjwBYCRJkiRJqmZgMVImUUgcCYEaOyMzn9SmbTsjadMZvrZt4++Zn2zbtm3bxnrH2B00prurOjdSu5/vqufaK52JCEiQJLdtDiSEcADn8FmAju837th9feh/sZePZ96z3uzLfjAuzkGZLhzvQST/o8oO9WZ9Snjc4Hld1e8lD2X8H1B3WNbgjMY7pl65W9HrDcBrcF9u2DpPtFdeW6cf8iGKwKFxDq9tvKOF46O+OYf79fHz4lu+63YEgZ68+fN19k37brr4wyQrnF879xwCCi5uRtd32g+jeqHx2og4UD/mMQ5xjxqOB4H9aTXJq/5zZN/BGc+nTfdDF897g73z2K9uxO1dOMcmWOiGwCvXahj9jq20I+iDKYQzUcxzhaN8g5flj6hrvrxaAbfd7j7 GF0aW9uPgogICAgICA8L3JkZjpEZXNjcmlwdGlvbj4KICAgPC9yZGY6UkRGPgo8L3g6eG1wbWV0YT4KAA==' style='width: 80%' /\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EFrom the dashboard, scroll down and click the Composer tile \u2014 \u201cGraphically build and run circuits.\u201d\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eThe backends list is \u0026#92;u003cstrong\u0026#92;u003elive\u0026#92;u003c/strong\u0026#92;u003e \u2014 you can read each machine\u0026#x27;s noise and queue \u0026#92;u003cem\u0026#92;u003ebefore\u0026#92;u003c/em\u0026#92;u003e you use it.\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;warn\u0026quot;'\u003E\u003C/marimo-callout-output\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "ddc1d31a4ee795c51be0fde79504b321", "console": [], "id": "lEQa", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"exercise-1-hello-quantum-baseline-20-min\"\u003EExercise 1 \u2014 Hello, quantum  \u00b7  \u003Cem\u003Ebaseline\u003C/em\u003E  \u00b7  20 min\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EOne qubit, one gate, one measurement \u2014 get a histogram out of real hardware.\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EDrag a single \u003Cstrong\u003Equbit line\u003C/strong\u003E onto the canvas.\u003C/li\u003E\n\u003Cli\u003EDrag an \u003Cstrong\u003EH\u003C/strong\u003E (Hadamard) gate onto it.\u003C/li\u003E\n\u003Cli\u003EDrag a \u003Cstrong\u003Emeasurement\u003C/strong\u003E after the H.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ERun\u003C/strong\u003E on the \u003Cstrong\u003Esimulator\u003C/strong\u003E first.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ERun\u003C/strong\u003E again on a \u003Cstrong\u003Ereal backend\u003C/strong\u003E (ask Wael which). Wait in the queue.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003ERecord \u2014 simulator:\u003C/em\u003E |0\u27e9 ___ % / |1\u27e9 ___ %  \u00b7  \u003Cem\u003Ehardware:\u003C/em\u003E |0\u27e9 ___ % / |1\u27e9 ___ %\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eSimulator: a clean ~50/50. Real hardware: close to 50/50 but off by a few percent, drifting with how long ago the machine was calibrated.\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;warn\u0026quot;'\u003E\u003C/marimo-callout-output\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "a7153be44d371fd12822270c10c9d47f", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"exercise-2-bell-state-baseline-stretch-25-min\"\u003EExercise 2 \u2014 Bell state  \u00b7  \u003Cem\u003Ebaseline \u2192 stretch\u003C/em\u003E  \u00b7  25 min\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EEntangle two qubits. This is the exact circuit behind this morning's CHSH result \u2014 in three drag-and-drops.\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EAdd a \u003Cstrong\u003Esecond qubit line\u003C/strong\u003E.\u003C/li\u003E\n\u003Cli\u003EDrag \u003Cstrong\u003EH\u003C/strong\u003E onto qubit 0.\u003C/li\u003E\n\u003Cli\u003EDrag \u003Cstrong\u003ECNOT\u003C/strong\u003E \u2014 control on qubit 0, target on qubit 1.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EMeasure\u003C/strong\u003E both qubits.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ERun\u003C/strong\u003E on the simulator, then on real hardware.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003ERecord \u2014 hardware counts:\u003C/em\u003E |00\u27e9 ___ %  \u00b7  |11\u27e9 ___ %  \u00b7  |01\u27e9 ___ %  \u00b7  |10\u27e9 ___ %\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eTwo big peaks \u2014 |00\u27e9 and |11\u27e9 \u2014 and two little peaks \u2014 |01\u27e9 and |10\u27e9 \u2014 that, in a perfect world, shouldn\u0026#x27;t be there at all.\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;warn\u0026quot;'\u003E\u003C/marimo-callout-output\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EThink:\u003C/strong\u003E a perfect Bell state gives |00\u27e9 and |11\u27e9 in equal amounts and \u003Cem\u003Enothing\u003C/em\u003E else.\nWhat do you think those small |01\u27e9 / |10\u27e9 peaks are? \u003Cem\u003E(stretch)\u003C/em\u003E Whoever's |00\u27e9:|11\u27e9 split is\nclosest to 50/50 is sitting on the least-noisy backend in the room.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "5236fcacbb1d524d00d6fe0c78b6a888", "console": [], "id": "Xref", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"exercise-3-your-choice-stretch-aspirational-20-min\"\u003EExercise 3 \u2014 Your choice  \u00b7  \u003Cem\u003Estretch / aspirational\u003C/em\u003E  \u00b7  20 min\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EPick \u003Cstrong\u003Eone\u003C/strong\u003E, build it, run it, then show your histogram to a neighbour and explain what you see.\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003E#\u003C/th\u003E\n\u003Cth\u003EBuild\u003C/th\u003E\n\u003Cth\u003ETier\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003EA\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003EGHZ state\u003C/strong\u003E \u2014 three qubits that always agree. H on qubit 0, then a CNOT to qubit 1 and a CNOT to qubit 2, then measure all three.\u003C/td\u003E\n\u003Ctd\u003E\u003Cem\u003Estretch\u003C/em\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003EB\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003EBiased quantum coin\u003C/strong\u003E \u2014 H, then an \u003Cmarimo-tex class=\"arithmatex\"\u003E||(R_y||)\u003C/marimo-tex\u003E rotation (Composer gives you an angle slider). Watch the distribution tilt. Can you hit exactly 25 / 75?\u003C/td\u003E\n\u003Ctd\u003E\u003Cem\u003Estretch\u003C/em\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003EC\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003EInterference\u003C/strong\u003E \u2014 on one qubit: H, then Z, then H again. What comes out? \u003Cem\u003EPredict before you run.\u003C/em\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Cem\u003Easpirational\u003C/em\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003ERecord \u2014 what you built and what the histogram showed:\u003C/em\u003E ____\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "9ea70205418eb142ff2ec6d5420fce6d", "console": [], "id": "SFPL", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"wrap-up-10-min\"\u003EWrap-up  \u00b7  10 min\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EBack to the \u003Cstrong\u003ECompute resources\u003C/strong\u003E page. Find the \u003Cstrong\u003Ejobs run today\u003C/strong\u003E counter for the backend the class used most.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eThousands of jobs, from research groups around the world \u2014 you just used the same machine as someone at a university continents away, hours ago.\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;warn\u0026quot;'\u003E\u003C/marimo-callout-output\u003E\u003C/div\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.23.14", "script_metadata_hash": null}, "version": "1"},
